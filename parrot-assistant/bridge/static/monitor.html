<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parrot Pipeline Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e28;
    --border: #252a36;
    --text: #d4d8e4;
    --text-muted: #6b7280;
    --stt-color: #3b82f6;
    --stt-bg: rgba(59,130,246,0.12);
    --llm-color: #f59e0b;
    --llm-bg: rgba(245,158,11,0.12);
    --tts-color: #10b981;
    --tts-bg: rgba(16,185,129,0.12);
    --idle-color: #374151;
    --idle-text: #6b7280;
  }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  header .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  header .status {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  header .status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    margin-right: 6px;
    vertical-align: middle;
  }
  header .status .dot.ok { background: #10b981; }

  /* ---- Thread Status Boxes ---- */
  .threads {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .thread-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .thread-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--idle-color);
    transition: background 0.3s;
  }

  .thread-box.processing::before { animation: pulse-bar 1.2s ease infinite; }

  .thread-box[data-thread="stt"].processing { border-color: var(--stt-color); background: var(--stt-bg); }
  .thread-box[data-thread="stt"].processing::before { background: var(--stt-color); }

  .thread-box[data-thread="llm"].processing { border-color: var(--llm-color); background: var(--llm-bg); }
  .thread-box[data-thread="llm"].processing::before { background: var(--llm-color); }

  .thread-box[data-thread="tts"].processing { border-color: var(--tts-color); background: var(--tts-bg); }
  .thread-box[data-thread="tts"].processing::before { background: var(--tts-color); }

  @keyframes pulse-bar {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .thread-box .label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .thread-box[data-thread="stt"] .label { color: var(--stt-color); }
  .thread-box[data-thread="llm"] .label { color: var(--llm-color); }
  .thread-box[data-thread="tts"] .label { color: var(--tts-color); }

  .thread-box .state {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: var(--idle-text);
    transition: color 0.3s;
  }

  .thread-box.processing .state { color: var(--text); }

  .thread-box .timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    min-height: 20px;
  }

  .thread-box .preview {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 18px;
  }

  /* ---- Gantt Section ---- */
  .gantt-section h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .gantt-container {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .gantt-job {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .gantt-job-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .gantt-job-header .job-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
  }

  .gantt-job-header .total-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
  }

  .gantt-timeline {
    position: relative;
    height: auto;
    min-height: 40px;
  }

  .gantt-lane {
    position: relative;
    height: 26px;
    margin-bottom: 4px;
  }

  .gantt-lane-label {
    position: absolute;
    left: 0;
    top: 0;
    width: 70px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    line-height: 26px;
    text-align: right;
    padding-right: 8px;
  }

  .gantt-lane-track {
    position: relative;
    margin-left: 74px;
    height: 26px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: visible;
  }

  /* Make stacks readable when there are many sentence lanes */
  .gantt-job { padding-bottom: 10px; }
  .gantt-job-header { margin-bottom: 12px; }

  .gantt-bar {
    position: absolute;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    min-width: 4px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .gantt-bar.llm { background: var(--llm-color); }
  .gantt-bar.tts { background: var(--tts-color); }
  .gantt-bar.unity { background: #2563eb; }

  .gantt-bar .bar-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }

  /* Tick marks on timeline */
  .gantt-ticks {
    position: relative;
    margin-left: 74px;
    height: 16px;
  }

  .gantt-tick {
    position: absolute;
    top: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--text-muted);
    transform: translateX(-50%);
  }

  .gantt-tick::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 50%;
    width: 1px;
    height: 3px;
    background: var(--border);
  }

  /* Arrow markers showing send-to-unity events */
  .gantt-marker {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 28px;
    background: rgba(255,255,255,0.3);
    border-radius: 1px;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px;
    background: var(--surface);
    border-radius: 14px;
    border: 1px dashed var(--border);
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .legend-item .swatch {
    width: 14px; height: 14px;
    border-radius: 3px;
  }
  .legend-item .swatch.llm { background: var(--llm-color); }
  .legend-item .swatch.tts { background: var(--tts-color); }
  .legend-item .swatch.unity { background: #2563eb; }
  .legend-item .swatch.send-mark {
    background: none;
    border: 1px dashed rgba(255,255,255,0.3);
    width: 2px;
    height: 14px;
    border-radius: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🦜</div>
  <h1>Pipeline Monitor</h1>
  <div class="status">
    <span class="dot" id="ws-dot"></span>
    <span id="ws-label">connecting...</span>
  </div>
</header>

<div class="threads">
  <div class="thread-box" data-thread="stt" id="box-stt">
    <div class="label">STT (Whisper)</div>
    <div class="state" id="state-stt">Idle</div>
    <div class="timer" id="timer-stt"></div>
    <div class="preview" id="preview-stt"></div>
  </div>
  <div class="thread-box" data-thread="llm" id="box-llm">
    <div class="label">LLM (Ollama)</div>
    <div class="state" id="state-llm">Idle</div>
    <div class="timer" id="timer-llm"></div>
    <div class="preview" id="preview-llm"></div>
  </div>
  <div class="thread-box" data-thread="tts" id="box-tts">
    <div class="label">TTS (F5-TTS)</div>
    <div class="state" id="state-tts">Idle</div>
    <div class="timer" id="timer-tts"></div>
    <div class="preview" id="preview-tts"></div>
  </div>
</div>

<div class="gantt-section">
  <h2>Recent Jobs</h2>
  <div class="legend">
    <div class="legend-item"><div class="swatch llm"></div>LLM</div>
    <div class="legend-item"><div class="swatch tts"></div>TTS (per segment)</div>
    <div class="legend-item"><div class="swatch unity"></div>Unity Play</div>
    <div class="legend-item"><div class="swatch send-mark"></div>Sent to Unity</div>
  </div>
  <div class="gantt-container" id="gantt"></div>
</div>

<script>
const WS_URL = `ws://${location.host}/ws/monitor`;
const MAX_JOBS = 5;

let socket = null;

// Timeline data: job_id (string) -> { input_preview, events: [{label, action, offset_ms, segment, total}] }
let jobs = {};
let jobOrder = [];

const threadTimers = { stt: null, llm: null, tts: null };
const threadStartTimes = { stt: 0, llm: 0, tts: 0 };

function connectWS() {
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    document.getElementById('ws-dot').classList.add('ok');
    document.getElementById('ws-label').textContent = 'connected';
  };

  socket.onclose = () => {
    document.getElementById('ws-dot').classList.remove('ok');
    document.getElementById('ws-label').textContent = 'disconnected';
    setTimeout(connectWS, 2000);
  };

  socket.onerror = () => {
    document.getElementById('ws-dot').classList.remove('ok');
    document.getElementById('ws-label').textContent = 'error';
  };

  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'thread_status') handleThreadStatus(msg);
    if (msg.type === 'timeline_event') handleTimelineEvent(msg);
    if (msg.type === 'job_event') handleJobEventFallback(msg);
  };
}

function handleThreadStatus(msg) {
  const { thread, status, elapsed_ms, input_preview, segment, total_segments } = msg;

  const box = document.getElementById(`box-${thread}`);
  const stateEl = document.getElementById(`state-${thread}`);
  const timerEl = document.getElementById(`timer-${thread}`);
  const previewEl = document.getElementById(`preview-${thread}`);

  if (status === 'processing') {
    box.classList.add('processing');
    stateEl.textContent = 'Processing';
    threadStartTimes[thread] = performance.now();
    previewEl.textContent = input_preview || '';

    if (thread === 'tts' && total_segments > 0) {
      stateEl.textContent = `[${segment + 1}/${total_segments}]`;
    }

    clearInterval(threadTimers[thread]);
    threadTimers[thread] = setInterval(() => {
      const elapsed = ((performance.now() - threadStartTimes[thread]) / 1000).toFixed(1);
      timerEl.textContent = `${elapsed}s`;
    }, 100);

  } else {
    box.classList.remove('processing');
    stateEl.textContent = 'Idle';
    clearInterval(threadTimers[thread]);
    threadTimers[thread] = null;

    if (elapsed_ms > 0) {
      timerEl.textContent = `${(elapsed_ms / 1000).toFixed(1)}s`;
    }
    if (input_preview) {
      previewEl.textContent = input_preview;
    }
  }
}

function handleTimelineEvent(msg) {
  const { job_id, label, action, offset_ms, segment, total } = msg;
  const key = String(job_id);

  if (!jobs[key]) {
    jobs[key] = { id: job_id, input_preview: '', events: [] };
    jobOrder.push(key);
    if (jobOrder.length > MAX_JOBS) {
      const old = jobOrder.shift();
      delete jobs[old];
    }
  }

  jobs[key].events.push({ label, action, offset_ms, segment, total });
  renderGantt();
}

// Fallback: translate legacy job_event (durations) into a simple stacked timeline
function handleJobEventFallback(msg) {
  const { job_id, phase, action, segment, total_segments, elapsed_ms } = msg;
  if (action !== 'end' || !elapsed_ms) return;

  const key = String(job_id);
  if (!jobs[key]) {
    jobs[key] = { id: job_id, input_preview: '', events: [], legacyCursorMs: 0 };
    jobOrder.push(key);
    if (jobOrder.length > MAX_JOBS) {
      const old = jobOrder.shift();
      delete jobs[old];
    }
  }

  // If we already have true timeline events for this job, ignore legacy.
  if (jobs[key].events && jobs[key].events.length > 0) return;

  const start = jobs[key].legacyCursorMs || 0;
  const end = start + elapsed_ms;
  jobs[key].legacyCursorMs = end;

  let label = phase;
  let segIdx = -1;
  let tot = 0;
  if (phase === 'tts') {
    label = 'tts';
    segIdx = segment ?? 0;
    tot = total_segments ?? 0;
  }

  // Emit synthetic timeline events
  jobs[key].events = jobs[key].events || [];
  jobs[key].events.push({ label, action: 'start', offset_ms: start, segment: segIdx, total: tot });
  jobs[key].events.push({ label, action: 'end', offset_ms: end, segment: segIdx, total: tot });
  renderGantt();
}

function renderGantt() {
  const container = document.getElementById('gantt');

  if (jobOrder.length === 0) {
    container.innerHTML = '<div class="empty-state">Waiting for first job...</div>';
    return;
  }

  let html = '';
  for (const key of jobOrder) {
    const job = jobs[key];
    if (!job || job.events.length === 0) continue;

    const maxOffset = Math.max(...job.events.map(e => e.offset_ms), 1);
    const totalSec = (maxOffset / 1000).toFixed(1);
    const bars = buildBars(job.events);
    const preview = escHtml(`Job #${job.id}`);

    const llmBars = bars.filter(b => b.label === 'llm');
    const ttsBars = bars.filter(b => b.label === 'tts');
    const unityBars = bars.filter(b => b.label === 'unity_play');
    const sendMarkers = job.events.filter(e => e.label === 'sent_to_unity' && e.action === 'end');

    // Determine how many sentences
    const segTotals = job.events.map(e => e.total || 0).filter(n => n > 0);
    const segCount = Math.max(
      segTotals.length ? Math.max(...segTotals) : 0,
      ttsBars.length ? Math.max(...ttsBars.map(b => (b.segment ?? 0) + 1)) : 0,
      unityBars.length ? Math.max(...unityBars.map(b => (b.segment ?? 0) + 1)) : 0,
      0
    );

    html += `<div class="gantt-job">`;
    html += `<div class="gantt-job-header">`;
    html += `  <div class="job-label">${preview} &nbsp; <span style="color:var(--text-muted);font-size:11px">${segCount} sentence${segCount !== 1 ? 's' : ''}</span></div>`;
    html += `  <div class="total-time">${totalSec}s</div>`;
    html += `</div>`;

    // LLM lane (always one)
    html += renderLane('LLM', llmBars, [], maxOffset, { laneKind: 'llm' });

    // One lane per sentence: TTS bar (green) + Unity bar (blue) on the SAME row
    if (segCount > 0) {
      for (let i = 0; i < segCount; i++) {
        const segTTS = ttsBars.filter(b => (b.segment ?? -1) === i);
        const segUnity = unityBars.filter(b => (b.segment ?? -1) === i);
        const segMarkers = sendMarkers.filter(m => (m.segment ?? -1) === i);
        const combined = [...segTTS, ...segUnity];
        html += renderLane(`[${i + 1}/${segCount}]`, combined, segMarkers, maxOffset, { laneKind: 'mixed' });
      }
    } else {
      // Fallback: single combined row
      const combined = [...ttsBars, ...unityBars];
      html += renderLane('TTS+Unity', combined, sendMarkers, maxOffset, { laneKind: 'mixed' });
    }

    html += renderTicks(maxOffset);
    html += `</div>`;
  }

  container.innerHTML = html;
}

function buildBars(events) {
  // Group events by (label, segment) to find start/end pairs
  const map = {};
  for (const e of events) {
    const k = `${e.label}:${e.segment}`;
    if (!map[k]) map[k] = {};
    map[k][e.action] = e.offset_ms;
    map[k].label = e.label;
    map[k].segment = e.segment;
    map[k].total = e.total;
  }

  const result = [];
  const maxOffset = Math.max(...events.map(e => e.offset_ms), 1);
  for (const v of Object.values(map)) {
    if (v.start != null) {
      // If we never got an end event (e.g., Unity feedback dropped), render a partial bar
      // extending to the current known max offset for the job.
      const end = (v.end != null) ? v.end : maxOffset;
      result.push({
        label: v.label,
        segment: v.segment,
        total: v.total,
        start_ms: v.start,
        end_ms: end,
        duration_ms: Math.max(0, end - v.start),
        partial: (v.end == null),
      });
    }
  }
  return result;
}

function renderLane(laneLabel, bars, markers, maxMs, opts = {}) {
  let h = `<div class="gantt-lane">`;
  h += `<div class="gantt-lane-label">${escHtml(laneLabel)}</div>`;
  h += `<div class="gantt-lane-track">`;

  for (const b of bars) {
    const left = (b.start_ms / maxMs) * 100;
    const width = Math.max(0.5, (b.duration_ms / maxMs) * 100);
    const sec = (b.duration_ms / 1000).toFixed(1);
    // Color by what the bar IS, not what lane it's in
    const cssClass = b.label === 'llm' ? 'llm' : b.label === 'tts' ? 'tts' : 'unity';

    // Compact labels
    let barLabel = b.label === 'llm' ? 'LLM' : b.label === 'tts' ? 'TTS' : 'PLAY';

    const tooltip = `${barLabel}: ${(b.start_ms/1000).toFixed(2)}s \u2192 ${(b.end_ms/1000).toFixed(2)}s (${sec}s)`;

    const opacity = b.partial ? 0.55 : 1.0;
    h += `<div class="gantt-bar ${cssClass}" style="left:${left}%;width:${width}%;opacity:${opacity}" title="${escHtml(tooltip)}">`;
    h += `<span class="bar-text">${barLabel} ${sec}s</span>`;
    h += `</div>`;
  }

  // Dashed markers for "sent to unity"
  for (const m of markers) {
    const left = (m.offset_ms / maxMs) * 100;
    const tooltip = `Sent [${m.segment + 1}/${m.total}] @ ${(m.offset_ms/1000).toFixed(2)}s`;
    h += `<div class="gantt-marker" style="left:${left}%" title="${escHtml(tooltip)}"></div>`;
  }

  h += `</div></div>`;
  return h;
}

function renderTicks(maxMs) {
  const numTicks = 6;
  let h = `<div class="gantt-ticks">`;
  for (let i = 0; i <= numTicks; i++) {
    const ms = (maxMs / numTicks) * i;
    const left = (ms / maxMs) * 100;
    const sec = (ms / 1000).toFixed(1);
    h += `<div class="gantt-tick" style="left:${left}%">${sec}s</div>`;
  }
  h += `</div>`;
  return h;
}

function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderGantt();
connectWS();
</script>
</body>
</html>
